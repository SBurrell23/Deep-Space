<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deep Space</title>
<meta name="description" content="Deep Space — a roguelike space shooter. Fly a ship out through a fogged web of star systems, levelling as you go, until you are strong enough to face the Master Fleet.">
<meta name="theme-color" content="#05070f">
<link rel="stylesheet" href="styles/main.css">
<link rel="stylesheet" href="styles/action.css">
<link rel="stylesheet" href="styles/ui2.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2305070f'/><rect x='2' y='7' width='9' height='3' fill='%234fe3f5'/><rect x='11' y='6' width='3' height='5' fill='%2317a2b8'/><rect x='4' y='4' width='4' height='2' fill='%238494b8'/><rect x='4' y='11' width='4' height='2' fill='%238494b8'/></svg>">
</head>
<body>

<!-- Persistent starfield behind every screen -->
<canvas id="backdrop" aria-hidden="true"></canvas>

<div id="app">

  <!-- ================= TITLE ================= -->
  <section class="screen" id="screen-title" data-screen="title">
    <div class="title-wrap">
      <h1 class="game-title"><span>DEEP</span><span class="accent">SPACE</span></h1>
      <nav class="menu" id="title-menu">
        <button class="btn btn-primary" data-action="continue" id="btn-continue" hidden>
          <span class="btn-label">Continue Run</span>
          <span class="btn-sub" id="continue-sub"></span>
        </button>
        <button class="btn btn-primary" data-action="new-run">New Run</button>
        <button class="btn" data-action="hangar">Hangar</button>
        <button class="btn" data-action="achievements">Achievements</button>
        <button class="btn" data-action="stats">Records</button>
        <button class="btn" data-action="help">How To Play</button>
        <button class="btn" data-action="settings">Sound &amp; Settings</button>
      </nav>
      <p class="version">v3.0</p>
    </div>
  </section>

  <!-- ================= HANGAR ================= -->
  <section class="screen" id="screen-hangar" data-screen="hangar" hidden>
    <header class="screen-head">
      <button class="btn btn-ghost" data-action="back">&larr; Back</button>
      <h2>Hangar</h2>
      <div class="head-right"><span id="hangar-unlocked" class="pill"></span></div>
    </header>
    <div class="hangar">
      <ul class="ship-list" id="ship-list" role="listbox" aria-label="Available hulls"></ul>
      <div class="ship-detail" id="ship-detail"></div>
    </div>
  </section>

  <!-- ================= ACHIEVEMENTS ================= -->
  <section class="screen" id="screen-achievements" data-screen="achievements" hidden>
    <header class="screen-head">
      <button class="btn btn-ghost" data-action="back">&larr; Back</button>
      <h2>Achievements</h2>
      <div class="head-right"><span id="ach-progress" class="pill"></span></div>
    </header>
    <div class="scroll-pane"><div class="ach-grid" id="ach-grid"></div></div>
  </section>

  <!-- ================= RECORDS ================= -->
  <section class="screen" id="screen-stats" data-screen="stats" hidden>
    <header class="screen-head">
      <button class="btn btn-ghost" data-action="back">&larr; Back</button>
      <h2>Records</h2>
      <div class="head-right"><button class="btn btn-ghost btn-danger" data-action="wipe">Erase All Data</button></div>
    </header>
    <div class="scroll-pane">
      <h3 class="section-title" style="margin-top:0">Lifetime</h3>
      <div class="stat-grid" id="stat-grid"></div>
      <h3 class="section-title">Recent Runs</h3>
      <div class="history" id="history"></div>
    </div>
  </section>

  <!-- ================= HELP ================= -->
  <section class="screen" id="screen-help" data-screen="help" hidden>
    <header class="screen-head">
      <button class="btn btn-ghost" data-action="back">&larr; Back</button>
      <h2>How To Play</h2>
      <div class="head-right"></div>
    </header>
    <div class="scroll-pane"><div class="help-body" id="help-body"></div></div>
  </section>

  <!-- ================= GAME ================= -->
  <section class="screen screen-game" id="screen-game" data-screen="game" hidden>

    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <button class="btn btn-ghost btn-icon" data-action="pause-menu" title="Menu (Esc)">&#9776;</button>
        <span class="res res-credits" id="res-credits" title="Credits"><i data-icon="icon_credits"></i><b>0</b></span>
        <span class="levelchip" id="level-chip" title="Level and experience">
          <span class="lc-badge">LV <b id="level-num">1</b></span>
          <span class="lc-bar"><span id="xp-fill"></span><em id="xp-text"></em></span>
        </span>
        <span class="pointpip" id="point-pip" hidden title="Unspent attribute points">+<b id="point-count">0</b> to spend</span>
      </div>
      <div class="topbar-mid">
        <span class="node-label" id="node-label">Deep Space</span>
        <span class="node-sub" id="node-sub"></span>
      </div>
      <div class="topbar-right">
        <span class="hull-readout" id="hull-readout"></span>
        <span class="hull-bar" id="hull-bar"><span id="hull-fill"></span></span>
        <button class="btn btn-ghost btn-icon" data-action="settings" title="Sound &amp; settings">&#9881;</button>
      </div>
    </header>

    <div class="play-area" id="play-area">
      <!-- Universe map. A sibling of the action stage, not a child of it: it
           fills the whole play area and must survive the stage being hidden. -->
      <canvas id="mapcanvas"></canvas>

      <!-- Action. The wrapper holds the field aspect so the HUD can pin to the
           play field itself rather than to the whole play area. -->
      <div class="stage-wrap" id="stage-wrap" hidden>
        <canvas id="stage"></canvas>

        <!-- Combat HUD, drawn in DOM over the stage -->
        <div class="combat-hud" id="combat-hud">
        <div class="hud-bars">
          <div class="bar bar-hull"><i></i><span id="bar-hull"></span><b id="hull-num"></b></div>
          <div class="bar bar-shield"><i></i><span id="bar-shield"></span><b id="shield-num"></b></div>
          <div class="bar bar-energy"><i></i><span id="bar-energy"></span><b id="energy-num"></b></div>
        </div>
        <div class="hud-objective" id="hud-objective"></div>
        <div class="boss-bar" id="boss-bar" hidden>
          <div class="bb-name" id="bb-name"></div>
          <div class="bb-track"><span id="bb-fill"></span></div>
        </div>
        <div class="hud-bottom-left">
          <!-- Abilities sit above the weapons: same corner, same glance. -->
          <div class="hud-abilities" id="hud-abilities"></div>
          <div class="hud-guns">
            <div class="hud-weapons" id="hud-weapons"></div>
            <div class="hud-dash" id="hud-dash"></div>
          </div>
        </div>
        </div>
      </div>

      <!-- Map HUD -->
      <div class="map-hud" id="map-hud">
        <div class="map-legend" id="map-legend"></div>
        <div class="map-controls">
          <button class="btn btn-small" data-action="zoom-in" title="Zoom in">+</button>
          <button class="btn btn-small" data-action="zoom-out" title="Zoom out">&minus;</button>
          <button class="btn btn-small" data-action="recentre" title="Centre on your position">Centre</button>
        </div>
        <!-- The loadout is checked constantly, so it gets a real target with
             the ship on it rather than a word in the corner of the header. -->
        <button class="ship-button" id="ship-button" data-action="inventory" title="Ship &amp; loadout — I">
          <span class="sb-art" id="sb-art"></span>
          <span class="sb-text">
            <span class="sb-name" id="sb-name">Ship</span>
            <span class="sb-sub" id="sb-sub"></span>
          </span>
        </button>
        <div class="node-card" id="node-card" hidden></div>
      </div>

      <div class="event-log" id="event-log" aria-live="polite"></div>
    </div>
  </section>

</div>

<!-- ================= MODALS ================= -->

<div class="modal-root" id="modal-root" hidden>
  <div class="modal-backdrop" data-action="modal-dismiss"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h3 class="modal-title" id="modal-title"></h3>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<!-- Sound &amp; settings, reachable from every screen -->
<div class="modal-root" id="settings-root" hidden>
  <div class="modal-backdrop" data-action="settings-dismiss"></div>
  <div class="modal modal-settings" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <h3 class="modal-title" id="settings-title">Sound &amp; Settings</h3>
    <div class="modal-body">
      <div class="setting-row">
        <label for="vol-master">Master volume</label>
        <input type="range" id="vol-master" min="0" max="100" step="1">
        <output for="vol-master" id="out-master">80%</output>
      </div>
      <div class="setting-row">
        <label for="vol-music">Music</label>
        <input type="range" id="vol-music" min="0" max="100" step="1">
        <output for="vol-music" id="out-music">55%</output>
      </div>
      <div class="setting-row">
        <label for="vol-sfx">Sound effects</label>
        <input type="range" id="vol-sfx" min="0" max="100" step="1">
        <output for="vol-sfx" id="out-sfx">75%</output>
      </div>
      <div class="setting-row setting-check">
        <input type="checkbox" id="opt-mute">
        <label for="opt-mute">Mute everything</label>
      </div>
      <hr class="rule">
      <div class="setting-row setting-check">
        <input type="checkbox" id="opt-rotate">
        <label for="opt-rotate">Ship turns to face the cursor</label>
      </div>
      <div class="setting-row setting-check">
        <input type="checkbox" id="opt-autofire">
        <label for="opt-autofire">Hold-to-fire (uncheck for autofire)</label>
      </div>
      <div class="setting-cursor">
        <label id="cursor-label">Cursor</label>
        <div class="cursor-picker" id="cursor-picker" role="radiogroup" aria-labelledby="cursor-label">
          <button type="button" class="cursor-box" data-cursor="x" role="radio" aria-checked="true">
            <span class="cb-art"></span><span class="cb-name">Targeting X</span>
          </button>
          <button type="button" class="cursor-box" data-cursor="highvis" role="radio" aria-checked="false">
            <span class="cb-art"></span><span class="cb-name">High Vis</span>
          </button>
          <button type="button" class="cursor-box" data-cursor="ring" role="radio" aria-checked="false">
            <span class="cb-art"></span><span class="cb-name">Ring Sight</span>
          </button>
          <button type="button" class="cursor-box" data-cursor="classic" role="radio" aria-checked="false">
            <span class="cb-art"></span><span class="cb-name">System</span>
          </button>
        </div>
        <p class="cursor-hint">Hover a box to try it.</p>
      </div>
      <p class="setting-note" id="audio-note"></p>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-action="test-sound">Test Sound</button>
      <button class="btn btn-ghost" data-action="reset-audio">Reset</button>
      <button class="btn btn-primary" data-action="settings-dismiss">Done</button>
    </div>
  </div>
</div>

<!-- Achievement / unlock toasts -->
<div class="toast-stack" id="toast-stack" aria-live="polite"></div>

<noscript>
  <div class="noscript">Deep Space needs JavaScript to run.</div>
</noscript>

<script type="module" src="src/main.js"></script>
</body>
</html>
